# Safety net only: if GitHub ever runs Jekyll on this repo, keep it away from the docs
# (they contain curly-brace text that Jekyll's template engine rejects). The real deploy is
# .github/workflows/deploy-qa.yml, which does not use Jekyll.
exclude:
  - "**/*.md"
  - node_modules
  - dev-tests
  - scripts
  - docs
  - handover
  - knowledge
  - package.json
  - package-lock.json
